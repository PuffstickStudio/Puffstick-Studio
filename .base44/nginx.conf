server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Development server: never cache, so every refresh shows the current
    # index.html from the bind mount.
    add_header Cache-Control "no-store" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The page is a single HTML file that loads its dependencies from CDNs; no
    # source maps or bundles are served here.
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }
}
