# Base44 sandbox compose.
#
# This project is a single-file static site (index.html): React + Babel +
# Tailwind are loaded from CDNs in the browser, all state lives in
# localStorage. There is no build step and no backend, so the site is served
# straight off the cloned source with nginx (bind-mounted, no caching) — edit
# index.html and refresh the preview to see the change.
services:
  web:
    image: nginx:alpine
    labels:
      base44.project: "Puffstick Studio"
      base44.kind: "web"
      base44.port: "3000"
    ports:
      - "3000:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./.base44/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      # Platform-provided; unused by nginx today, but kept available so future
      # sandbox-only configuration can gate on BASE44_PREVIEW_MODE === "1".
      - BASE44_PREVIEW_MODE
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/index.html || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: on-failure
