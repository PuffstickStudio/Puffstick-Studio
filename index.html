<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puffstick Studio 🎀✨ - Daily Pre-Order Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Quicksand', sans-serif; background-color: #FDFBF7; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-[#FDFBF7] text-gray-800 antialiased selection:bg-pink-200">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const DEFAULT_LOGO = "🐰 Bunny";

        const INITIAL_PRODUCTS = [
            { 
                id: 'p1', 
                name: 'Bunny Bakery Book Set', 
                price: 45000, 
                category: "New Upload", 
                description: 'Set stiker bertema kafe hangat lengkap dengan minifigure akrilik.',
                image: '',
                isSoldOut: false,
                isBestSeller: true,
                options: ['🐰 Bunny', '🐻 Bear', '🐱 Cat Cafe'] 
            },
            { 
                id: 'p2', 
                name: 'Sanrio Diorama House 3D', 
                price: 85000, 
                category: 'Sticker', 
                description: 'Diorama toko roti mini 3D dengan bahan stiker tebal waterproof.',
                image: '',
                isSoldOut: false,
                isBestSeller: true,
                options: ['🎀 Cinnamoroll', '🖤 Kuromi', '⭐ Melody', '🍮 Pompompurin'] 
            },
            { 
                id: 'p3', 
                name: 'Precision Pink Tweezer', 
                price: 25000, 
                category: 'Tweezers', 
                description: 'Pinset stainless antikarat khusus untuk memasang stiker detail/diorama.',
                image: '',
                isSoldOut: false,
                isBestSeller: false,
                options: ['🐰 Pink Bunny', '🐱 Mint Cat', '🐻 White Bear'] 
            },
            { 
                id: 'p4', 
                name: 'Cat Cafe Daily Sticker Sheet', 
                price: 35000, 
                category: 'Sticker Book', 
                description: 'Sticker book menggemaskan bertema kafe kucing.',
                image: '',
                isSoldOut: false,
                isBestSeller: false,
                options: ['🍊 Orange Cat', '🐾 Grey Kitty', '💖 Calico'] 
            },
            { 
                id: 'p5', 
                name: 'Magical Bakery 3D Box Set', 
                price: 42000, 
                category: 'Sticker', 
                description: 'Box set diorama toko kue magis 3D.',
                image: '',
                isSoldOut: false,
                isBestSeller: false,
                options: ['🍓 Strawberry', '🧁 Vanilla'] 
            },
            { 
                id: 'p6', 
                name: 'Curved Craft Tweezer Mint', 
                price: 26000, 
                category: 'Tweezers', 
                description: 'Pinset ujung melengkung untuk memudahkan penataan stiker.',
                image: '',
                isBestSeller: false,
                options: ['✨ Mint Star', '💖 Pink Heart'] 
            }
        ];

        const CATEGORIES = ['Semua', 'New Upload', 'Sticker', 'Sticker Book', 'Tweezers'];

        function App() {
            const [currentPage, setCurrentPage] = useState('home');

            const [profileLogo, setProfileLogo] = useState(() => {
                return localStorage.getItem('puffstick_permanent_logo') || DEFAULT_LOGO;
            });

            const [products, setProducts] = useState(() => {
                const saved = localStorage.getItem('puffstick_products_v48');
                return saved ? JSON.parse(saved) : INITIAL_PRODUCTS;
            });

            const [cart, setCart] = useState(() => {
                const savedCart = localStorage.getItem('puffstick_cart_v48');
                return savedCart ? JSON.parse(savedCart) : [];
            });

            const [batchStatus, setBatchStatus] = useState(() => {
                return localStorage.getItem('puffstick_batch_status') || '🟢 OPEN PO Batch #5 (Closed Minggu)';
            });

            const [selectedCategory, setSelectedCategory] = useState('Semua');
            const [searchQuery, setSearchQuery] = useState('');
            const [sortBy, setSortBy] = useState('default');
            const [isCartOpen, setIsCartOpen] = useState(false);
            const [isAdminOpen, setIsAdminOpen] = useState(false);
            const [isProfileMenuOpen, setIsProfileMenuOpen] = useState(false);
            
            const [showPinModal, setShowPinModal] = useState(false);
            const [pinInput, setPinInput] = useState('');
            const [showNotification, setShowNotification] = useState('');
            
            const logoInputRef = useRef(null);
            const [selectedOptions, setSelectedOptions] = useState({});

            const [customerInfo, setCustomerInfo] = useState(() => {
                const savedInfo = localStorage.getItem('puffstick_customer_v48');
                return savedInfo ? JSON.parse(savedInfo) : { name: '', phone: '', notes: '', shippingMethod: 'sea' };
            });

            const [newProduct, setNewProduct] = useState({
                name: '', price: '', category: 'New Upload', description: '', image: '', isBestSeller: false, optionsStr: '🐰 Bunny, 🐻 Bear, 🐱 Cat'
            });

            useEffect(() => {
                localStorage.setItem('puffstick_products_v48', JSON.stringify(products));
            }, [products]);

            useEffect(() => {
                localStorage.setItem('puffstick_permanent_logo', profileLogo);
            }, [profileLogo]);

            useEffect(() => {
                localStorage.setItem('puffstick_cart_v48', JSON.stringify(cart));
            }, [cart]);

            useEffect(() => {
                localStorage.setItem('puffstick_customer_v48', JSON.stringify(customerInfo));
            }, [customerInfo]);

            useEffect(() => {
                localStorage.setItem('puffstick_batch_status', batchStatus);
            }, [batchStatus]);

            const notify = (msg) => {
                setShowNotification(msg);
                setTimeout(() => setShowNotification(''), 3000);
            };

            const playPlopSound = () => {
                try {
                    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    if (audioCtx.state === 'suspended') {
                        audioCtx.resume();
                    }
                    const osc = audioCtx.createOscillator();
                    const gainNode = audioCtx.createGain();
                    
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(500, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.15);
                    
                    gainNode.gain.setValueAtTime(0.4, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                    
                    osc.connect(gainNode);
                    gainNode.connect(audioCtx.destination);
                    
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.15);
                } catch (e) {
                    console.log('Audio error:', e);
                }
            };

            const handlePinSubmit = (e) => {
                e.preventDefault();
                if (pinInput === '160900') {
                    setShowPinModal(false);
                    setPinInput('');
                    setIsAdminOpen(true);
                    setCurrentPage('catalog');
                    notify('✨ Halo Owner Cantik! Berhasil masuk Admin Panel 💕');
                } else {
                    alert('PIN Salah, Beb! Coba ingat-ingat lagi ya 🤭');
                    setPinInput('');
                }
            };

            const handleGlobalLogoUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setProfileLogo(reader.result);
                        setIsAdminOpen(false);
                        notify('✨ Yeay! Logo toko berhasil diubah permanen!');
                    };
                    reader.readAsDataURL(file);
                }
            };

            const handleProductImageUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setNewProduct(prev => ({ ...prev, image: reader.result }));
                        notify('📸 Gambar produk berhasil dimuat!');
                    };
                    reader.readAsDataURL(file);
                }
            };

            const toggleSoldOut = (id) => {
                setProducts(prev => prev.map(p => p.id === id ? { ...p, isSoldOut: !p.isSoldOut } : p));
                notify('🔄 Status stok produk berhasil diubah!');
            };

            const deleteProduct = (id) => {
                if (confirm('Yakin mau hapus produk ini, beb?')) {
                    setProducts(prev => prev.filter(p => p.id !== id));
                    notify('🗑️ Produk berhasil dihapus!');
                }
            };

            const filteredProducts = useMemo(() => {
                let result = products.filter(p => {
                    const matchesCategory = selectedCategory === 'Semua' ? true : p.category === selectedCategory;
                    const matchesSearch = p.name.toLowerCase().includes(searchQuery.toLowerCase());
                    return matchesCategory && matchesSearch;
                });

                if (sortBy === 'cheapest') {
                    result.sort((a, b) => a.price - b.price);
                } else if (sortBy === 'expensive') {
                    result.sort((a, b) => b.price - a.price);
                }
                return result;
            }, [products, selectedCategory, searchQuery, sortBy]);

            const handleOptionSelect = (productId, option) => {
                setSelectedOptions(prev => ({ ...prev, [productId]: option }));
            };

            const addToCart = (product) => {
                if (product.isSoldOut) return;
                playPlopSound();
                const chosenOption = selectedOptions[product.id] || (product.options && product.options[0]) || 'Default';
                const cartItemId = `${product.id}_${chosenOption}`;

                setCart(prev => {
                    const existing = prev.find(item => item.cartItemId === cartItemId);
                    if (existing) {
                        return prev.map(item => item.cartItemId === cartItemId ? { ...item, quantity: item.quantity + 1 } : item);
                    }
                    return [...prev, { ...product, cartItemId, selectedOption: chosenOption, quantity: 1 }];
                });
                notify(`✨ Berhasil memasukkan ${product.name} (${chosenOption}) ke keranjang!`);
            };

            const updateQty = (cartItemId, delta) => {
                setCart(prev => {
                    return prev.map(item => {
                        if (item.cartItemId === cartItemId) {
                            const newQty = item.quantity + delta;
                            return newQty > 0 ? { ...item, quantity: newQty } : null;
                        }
                        return item;
                    }).filter(Boolean);
                });
            };

            const subtotal = useMemo(() => cart.reduce((sum, item) => sum + (item.price * item.quantity), 0), [cart]);
            
            const jastipFee = useMemo(() => {
                if (cart.length === 0) return 0;
                let baseFee = 0;
                if (subtotal < 49000) baseFee = 5000;
                else if (subtotal <= 99000) baseFee = 8000;
                else if (subtotal <= 199000) baseFee = 12000;
                else if (subtotal <= 349000) baseFee = 20000;
                else {
                    baseFee = subtotal * 0.08;
                }

                if (customerInfo.shippingMethod === 'air') {
                    return Math.round(baseFee * 1.5);
                }
                return Math.round(baseFee);
            }, [subtotal, customerInfo.shippingMethod, cart.length]);

            const grandTotal = subtotal + jastipFee;

            const formatRp = (num) => 'Rp ' + Number(num).toLocaleString('id-ID');

            const buildOrderText = () => {
                let text = `*PRE-ORDER / ORDER FORM PUFFSTICK STUDIO* %0A`;
                text += `----------------------------------------%0A`;
                text += `👤 *Nama*: ${customerInfo.name} %0A`;
                text += `📱 *No Telp*: ${customerInfo.phone} %0A`;
                text += `----------------------------------------%0A`;
                text += `🛍️ *LIST PESANAN*:%0A`;
                cart.forEach((item, idx) => {
                    text += `${idx + 1}. ${item.name} (${item.selectedOption}) x${item.quantity} - ${formatRp(item.price * item.quantity)}%0A`;
                });
                text += `----------------------------------------%0A`;
                text += `🏷️ *Fee Jastip*: ${formatRp(jastipFee)} %0A`;
                text += `💎 *TOTAL PESANAN*: *${formatRp(grandTotal)}* %0A`;
                text += `----------------------------------------%0A`;
                text += `📦 *Metode Pengiriman*: ${customerInfo.shippingMethod === 'air' ? 'Via Udara/Pesawat (± 7-12 hari ✈️)' : 'Via Laut / Reguler 🚢 (± 4-5 minggu)'} %0A%0A`;
                if(customerInfo.notes) text += `📝 *Catatan*: ${customerInfo.notes} %0A%0A`;
                text += `Halo Minpuff! ✨%0A`;
                text += `Berikut list pesanan pre-order aku dari Puffstick Studio yaa.%0A`;
                text += `Mohon konfirmasi totalan dan bukti pembayarannya. Terima kasih Minpuff 💕`;
                return text;
            };

            const generateWAMessage = () => {
                if (!customerInfo.name || !customerInfo.phone) {
                    alert('Mohon isi Nama Pemesan dan No WhatsApp terlebih dahulu ya, beb! 💕');
                    return;
                }
                const waNumber = '6285888010164';
                window.open(`https://wa.me/${waNumber}?text=${buildOrderText()}`, '_blank');
            };

            const copyOrderTextOnly = () => {
                if (!customerInfo.name || !customerInfo.phone) {
                    alert('Isi Nama Pemesan & No WhatsApp dulu ya beb sebelum salin format! 💕');
                    return;
                }
                const plainText = decodeURIComponent(buildOrderText().replace(/%0A/g, '\n'));
                navigator.clipboard.writeText(plainText);
                notify('📋 Format pesanan berhasil disalin ke clipboard!');
            };

            const handleAddProduct = (e) => {
                e.preventDefault();
                if(!newProduct.name || !newProduct.price) return;
                const optionsArray = newProduct.optionsStr ? newProduct.optionsStr.split(',').map(s => s.trim()).filter(Boolean) : ['🐰 Default'];
                const created = {
                    id: 'p_' + Date.now(),
                    name: newProduct.name,
                    price: Number(newProduct.price),
                    category: newProduct.category,
                    description: newProduct.description || 'Stiker cute edisi terbatas dari Puffstick Studio.',
                    image: newProduct.image,
                    isSoldOut: false,
                    isBestSeller: newProduct.isBestSeller,
                    options: optionsArray
                };
                setProducts([created, ...products]);
                setNewProduct({ name: '', price: '', category: 'New Upload', description: '', image: '', isBestSeller: false, optionsStr: '🐰 Bunny, 🐻 Bear, 🐱 Cat' });
                notify('✨ Produk baru berhasil ditambahkan!');
            };

            return (
                <div className="min-h-screen pb-24 relative">
                    {showNotification && (
                        <div className="fixed top-4 left-1/2 transform -translate-x-1/2 z-50 bg-pink-600 text-white px-6 py-3 rounded-full shadow-lg text-sm font-bold flex items-center gap-2 animate-bounce">
                            <span>✨</span> {showNotification}
                        </div>
                    )}

                    <input 
                        type="file" 
                        ref={logoInputRef} 
                        onChange={handleGlobalLogoUpload} 
                        accept="image/*" 
                        className="hidden" 
                    />

                    {/* MODAL VERIFIKASI PIN OWNER */}
                    {showPinModal && (
                        <div className="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-white border-2 border-pink-200 rounded-3xl p-6 w-full max-w-sm shadow-2xl space-y-4">
                                <div className="text-center">
                                    <span className="text-3xl">🔐</span>
                                    <h3 className="text-sm font-bold text-pink-600 mt-2">Akses Khusus Owner</h3>
                                    <p className="text-[11px] text-gray-400 mt-0.5">Masukkan PIN rahasia untuk membuka menu Admin & Ganti Foto Profil.</p>
                                </div>
                                <form onSubmit={handlePinSubmit} className="space-y-3">
                                    <input 
                                        type="password" 
                                        placeholder="Masukkan PIN" 
                                        value={pinInput} 
                                        onChange={e => setPinInput(e.target.value)} 
                                        className="w-full text-center tracking-widest border border-pink-200 bg-pink-50/30 rounded-2xl px-4 py-3 text-sm font-bold focus:ring-2 focus:ring-pink-400 outline-none" 
                                        autoFocus
                                        required 
                                    />
                                    <div className="flex gap-2">
                                        <button type="button" onClick={() => setShowPinModal(false)} className="flex-1 bg-gray-100 text-gray-600 font-bold py-2.5 rounded-xl text-xs hover:bg-gray-200">Batal</button>
                                        <button type="submit" className="flex-1 bg-pink-500 text-white font-bold py-2.5 rounded-xl text-xs hover:bg-pink-600 shadow-md">Masuk</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* HEADER */}
                    <header className="sticky top-0 z-30 bg-white/90 backdrop-blur-md border-b border-pink-100 px-4 py-3">
                        <div className="max-w-2xl mx-auto flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div 
                                    onClick={() => setIsProfileMenuOpen(!isProfileMenuOpen)}
                                    className="w-10 h-10 rounded-full border-2 border-pink-300 overflow-hidden shadow-sm flex-shrink-0 bg-pink-50 cursor-pointer hover:scale-105 transition relative group"
                                    title="Klik untuk menu utama"
                                >
                                    <img src={profileLogo} alt="Puffstick Studio" className="w-full h-full object-cover" />
                                    <div className="absolute inset-0 bg-black/20 opacity-0 group-hover:opacity-100 transition flex items-center justify-center text-[10px] text-white font-bold">✨</div>
                                </div>
                                <div>
                                    <h1 className="text-lg font-bold text-pink-600 tracking-wide flex items-center gap-1 cursor-pointer" onClick={() => setCurrentPage('home')}>
                                        Puffstick Studio <span>🎀✨</span>
                                    </h1>
                                    <p className="text-[10px] text-gray-400 font-medium">Daily Pre-Order Sticker Shop</p>
                                </div>
                            </div>

                            <div className="flex items-center gap-2">
                                <button onClick={() => setIsCartOpen(true)} className="relative p-2.5 rounded-full bg-pink-500 text-white hover:bg-pink-600 transition shadow-md shadow-pink-200">
                                    <span className="text-lg">🛒</span>
                                    {cart.length > 0 && (
                                        <span className="absolute -top-1 -right-1 bg-amber-400 text-white text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center border-2 border-white">
                                            {cart.reduce((a, c) => a + c.quantity, 0)}
                                        </span>
                                    )}
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* POPUP MENU PROFIL */}
                    {isProfileMenuOpen && (
                        <div className="fixed inset-0 z-40 bg-black/30 backdrop-blur-[2px] flex items-start justify-start pt-16 pl-4" onClick={() => setIsProfileMenuOpen(false)}>
                            <div className="bg-white border-2 border-pink-200 rounded-2xl shadow-2xl p-2 w-60 space-y-1 animate-in fade-in zoom-in duration-200" onClick={e => e.stopPropagation()}>
                                <div className="px-3 py-2 border-b border-pink-100 mb-1">
                                    <p className="text-xs font-bold text-pink-600">Menu Navigasi 🎀</p>
                                    <p className="text-[10px] text-gray-400">Pilih halaman tujuan:</p>
                                </div>

                                <button 
                                    onClick={() => { setIsProfileMenuOpen(false); setCurrentPage('home'); window.scrollTo({top:0, behavior:'smooth'}); }} 
                                    className="w-full text-left px-3 py-2 rounded-xl text-xs font-bold text-gray-700 hover:bg-pink-50 flex items-center gap-2 transition"
                                >
                                    <span>🏠</span> Beranda / Home
                                </button>

                                <button 
                                    onClick={() => { setIsProfileMenuOpen(false); setCurrentPage('catalog'); window.scrollTo({top:0, behavior:'smooth'}); }} 
                                    className="w-full text-left px-3 py-2 rounded-xl text-xs font-bold text-gray-700 hover:bg-pink-50 flex items-center gap-2 transition"
                                >
                                    <span>🛍️</span> Katalog Produk
                                </button>

                                <button 
                                    onClick={() => { setIsProfileMenuOpen(false); setShowPinModal(true); }} 
                                    className="w-full text-left px-3 py-2 rounded-xl text-xs font-bold text-pink-600 hover:bg-pink-50 flex items-center gap-2 transition border-t border-dashed border-pink-100 mt-1 pt-2"
                                >
                                    <span>👑</span> Khusus Owner (Admin & Ganti Logo)
                                </button>
                            </div>
                        </div>
                    )}

                    <main className="max-w-2xl mx-auto px-4 pt-4">

                        {/* ========================================= */}
                        {/* HALAMAN 1: BERANDA / HOME COVER           */}
                        {/* ========================================= */}
                        {currentPage === 'home' && (
                            <div className="space-y-5 py-2 animate-in fade-in duration-300">
                                <div className="bg-gradient-to-br from-pink-100 via-rose-50 to-purple-100 border border-pink-200 p-6 rounded-3xl shadow-sm relative overflow-hidden text-center space-y-3">
                                    <div className="absolute -right-6 -bottom-6 text-7xl opacity-20">🎀</div>
                                    <div className="absolute -left-6 -top-6 text-7xl opacity-20">✨</div>
                                    
                                    <div className="w-20 h-20 rounded-full border-4 border-white mx-auto overflow-hidden shadow-md bg-white">
                                        <img src={profileLogo} alt="Cover Logo" className="w-full h-full object-cover" />
                                    </div>

                                    <div>
                                        <h2 className="text-base font-bold text-pink-600 tracking-wide">WELCOME TO PUFFSTICK STUDIO 🎀</h2>
                                        <p className="text-xs text-gray-600 mt-1 max-w-md mx-auto">
                                            Hai-hai! Sebelum ikutan PO, baca dulu sebentar ya ketentuan di bawah ini biar enak kedepannya 🛍️✨
                                        </p>
                                    </div>

                                    <div className="bg-white/90 backdrop-blur-sm border border-pink-200 rounded-2xl p-3 max-w-sm mx-auto shadow-sm space-y-1">
                                        <div className="inline-block bg-pink-100 text-pink-700 font-bold text-[11px] px-3.5 py-1 rounded-full shadow-sm">
                                            {batchStatus}
                                        </div>
                                        <p className="text-[10px] text-gray-500 pt-0.5">Cek berkala untuk info update posisi barang ya! ✈️📦</p>
                                    </div>

                                    <div className="pt-2">
                                        <button 
                                            onClick={() => { setCurrentPage('catalog'); window.scrollTo({top:0, behavior:'smooth'}); }} 
                                            className="bg-pink-500 text-white font-bold px-7 py-3 rounded-2xl text-xs hover:bg-pink-600 transition shadow-lg shadow-pink-200 flex items-center gap-2 mx-auto"
                                        >
                                            <span>✨</span> Mulai Belanja di Katalog Produk
                                        </button>
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                    <a href="https://whatsapp.com/channel/0029Vb8ysbZLY6d8cSQ5YY3U" target="_blank" rel="noopener noreferrer" className="bg-white border border-pink-200 p-3.5 rounded-2xl text-center shadow-sm hover:bg-pink-50 transition block">
                                        <span className="text-2xl">📢</span>
                                        <p className="text-xs font-bold text-pink-600 mt-1">Channel WhatsApp</p>
                                    </a>
                                    <a href="https://www.tiktok.com/@puffstick.id" target="_blank" rel="noopener noreferrer" className="bg-white border border-pink-200 p-3.5 rounded-2xl text-center shadow-sm hover:bg-pink-50 transition block">
                                        <span className="text-2xl">🎬</span>
                                        <p className="text-xs font-bold text-pink-600 mt-1">TikTok @puffstick.id</p>
                                    </a>
                                </div>

                                <div className="bg-white border border-pink-100 rounded-3xl p-5 shadow-sm space-y-4 text-xs text-gray-700 leading-relaxed">
                                    <div className="space-y-2 border-b border-pink-100 pb-3">
                                        <h3 className="font-bold text-pink-700 flex items-center gap-1.5 text-sm">
                                            <span>📦</span> Catatan Penting Pre-Order (PO):
                                        </h3>
                                        <ul className="list-disc pl-5 space-y-1 text-gray-600">
                                            <li>Semua barang di sini sistemnya PO ya.</li>
                                            <li>Cara pesannya langsung pilih produk, masukkan keranjang, dan kirim order via WhatsApp dari web ini! 🛒✨</li>
                                            <li>Wajib <b>Full Payment</b>.</li>
                                            <li>Tolong bayar total pesanan-nya tepat waktu ya biar gak ketinggalan list order 💳</li>
                                        </ul>
                                    </div>

                                    <div className="space-y-2 border-b border-pink-100 pb-3">
                                        <h3 className="font-bold text-pink-700 flex items-center gap-1.5 text-sm">
                                            <span>🎀</span> BIAYA FEE JASTIP PUFFSTICK STUDIO <span>🎀</span>
                                        </h3>
                                        <p className="text-[11px] text-gray-500 italic">Hitungannya per transaksi / per invoice (bukan per item) 💸</p>
                                        <div className="bg-pink-50/50 p-3 rounded-2xl border border-pink-100 space-y-1 font-medium text-gray-700">
                                            <p className="font-bold text-pink-600 mb-1">🏷️ Rate Fee Jastip:</p>
                                            <p>• Belanja di bawah 49k ➔ Rp 5.000</p>
                                            <p>• Belanja 50k – 99k ➔ Rp 8.000</p>
                                            <p>• Belanja 100k – 199k ➔ Rp 12.000</p>
                                            <p>• Belanja 200k – 349k ➔ Rp 20.000</p>
                                            <p>• Belanja di atas 350k ➔ <b>Cuma 8%!</b> (Makin borong makin hemat 🛒✨)</p>
                                        </div>
                                        <p className="text-[11px] text-pink-600 font-semibold">⚠️ Catatan: Fee jastip ini nanti dihitung barengan pas totalan surcin / invoice pembayaran yaa 💕</p>
                                    </div>

                                    <div className="space-y-2">
                                        <h3 className="font-bold text-pink-700 flex items-center gap-1.5 text-sm">
                                            <span>✈️</span> Estimasi Pengiriman:
                                        </h3>
                                        <ul className="list-disc pl-5 space-y-1 text-gray-600">
                                            <li>Pengiriman reguler via <b>Laut 🚢</b>: estimasi ± 4-5 minggu.</li>
                                            <li>Pengiriman via <b>Udara/Pesawat ✈️</b>: by request aja, estimasi lebih cepat ± 7-12 hari.</li>
                                            <li>Untuk barang PO, dimohon sedikit kesabarannya yaa 🙏🏻💖</li>
                                            <li>Nanti buat pengiriman akhir ke rumah masing-masing, kita via Shopee.</li>
                                        </ul>
                                    </div>

                                    <div className="pt-2 text-center font-bold text-pink-600">
                                        Makasih banyak ya udah mampir dan belanja di Puffstick Studio! Happy Shopping 🎀🛒✨
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* ========================================= */}
                        {/* HALAMAN 2: KATALOG PRODUK                 */}
                        {/* ========================================= */}
                        {currentPage === 'catalog' && (
                            <div className="space-y-4 animate-in fade-in duration-300">
                                <div className="bg-gradient-to-r from-pink-100 via-purple-50 to-pink-50 border border-pink-200 p-4 rounded-2xl flex items-center justify-between shadow-sm">
                                    <div className="flex items-center gap-3">
                                        <span className="text-2xl">📦</span>
                                        <div>
                                            <h2 className="text-xs font-bold text-pink-700 uppercase tracking-wider">OPEN PRE-ORDER</h2>
                                            <p className="text-[11px] text-gray-600">Pilih stiker & variasi favoritmu di bawah ya!</p>
                                        </div>
                                    </div>
                                    <button onClick={() => setCurrentPage('home')} className="bg-white text-pink-600 border border-pink-200 text-[10px] font-bold px-3 py-1.5 rounded-full hover:bg-pink-50">
                                        🏠 Kembali ke Home
                                    </button>
                                </div>

                                {isAdminOpen && (
                                    <div className="bg-white border-2 border-pink-300 rounded-3xl p-5 shadow-xl space-y-4">
                                        <div className="flex justify-between items-center border-b border-pink-100 pb-2 bg-pink-50 -mx-5 -mt-5 p-4 rounded-t-3xl">
                                            <h3 className="text-sm font-bold text-pink-600 flex items-center gap-1"><span>👑</span> Admin Panel (Owner Mode)</h3>
                                            <button onClick={() => setIsAdminOpen(false)} className="text-gray-400 hover:text-gray-600 text-sm font-bold bg-white px-2.5 py-1 rounded-full border border-pink-100">✕ Tutup</button>
                                        </div>

                                        {/* TOMBOL GANTI LOGO TOKO PERMANEN */}
                                        <div className="bg-pink-50/70 p-3.5 rounded-2xl border border-pink-200 space-y-2">
                                            <label className="text-xs font-bold text-pink-700 block">🖼️ Ganti Foto Logo Toko Utama:</label>
                                            <button 
                                                type="button" 
                                                onClick={() => logoInputRef.current.click()} 
                                                className="w-full bg-pink-500 text-white font-bold py-2.5 rounded-xl text-xs hover:bg-pink-600 shadow-sm flex items-center justify-center gap-2"
                                            >
                                                <span>📷</span> Pilih & Unggah Logo Baru dari Galeri
                                            </button>
                                            <p className="text-[10px] text-gray-500 italic">Foto logo akan otomatis tersimpan permanen di web tanpa takut hilang.</p>
                                        </div>

                                        <div className="bg-pink-50/50 p-3.5 rounded-2xl border border-pink-200 space-y-2">
                                            <label className="text-xs font-bold text-pink-700 block">📢 Update Status / Batch PO di Beranda:</label>
                                            <input 
                                                type="text" 
                                                value={batchStatus} 
                                                onChange={e => setBatchStatus(e.target.value)} 
                                                placeholder="Cth: 🟢 OPEN PO Batch #5 (Closed Minggu)" 
                                                className="w-full border border-pink-200 bg-white rounded-xl px-3 py-2 text-xs font-bold text-pink-600 focus:ring-2 focus:ring-pink-400 outline-none shadow-sm" 
                                            />
                                        </div>

                                        <form onSubmit={handleAddProduct} className="space-y-3 bg-pink-50/30 p-3.5 rounded-2xl border border-pink-100">
                                            <h4 className="text-xs font-bold text-pink-700">✨ Tambah Produk Satuan:</h4>
                                            <div className="grid grid-cols-2 gap-2">
                                                <input type="text" placeholder="Nama Barang" value={newProduct.name} onChange={e => setNewProduct({...newProduct, name: e.target.value})} className="border border-pink-100 bg-white rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-pink-400 outline-none" required />
                                                <input type="number" placeholder="Harga (Cth: 35000)" value={newProduct.price} onChange={e => setNewProduct({...newProduct, price: e.target.value})} className="border border-pink-100 bg-white rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-pink-400 outline-none" required />
                                            </div>
                                            <select value={newProduct.category} onChange={e => setNewProduct({...newProduct, category: e.target.value})} className="w-full border border-pink-100 bg-white rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-pink-400 outline-none">
                                                <option value="New Upload">New Upload</option>
                                                <option value="Sticker">Sticker</option>
                                                <option value="Sticker Book">Sticker Book</option>
                                                <option value="Tweezers">Tweezers</option>
                                            </select>
                                            
                                            <div className="space-y-1">
                                                <label className="text-[10px] font-bold text-gray-500">Foto Produk dari Galeri:</label>
                                                <input type="file" accept="image/*" onChange={handleProductImageUpload} className="w-full text-xs text-gray-500 file:mr-4 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:text-[11px] file:font-bold file:bg-pink-100 file:text-pink-600 hover:file:bg-pink-200 cursor-pointer bg-white rounded-xl border border-pink-100" />
                                            </div>

                                            <div className="flex items-center gap-2 pt-1">
                                                <input type="checkbox" id="bestSellerCheck" checked={newProduct.isBestSeller} onChange={e => setNewProduct({...newProduct, isBestSeller: e.target.checked})} className="w-4 h-4 accent-pink-500 rounded" />
                                                <label htmlFor="bestSellerCheck" className="text-xs font-bold text-gray-700 cursor-pointer">Jadikan Badge 🔥 Best Seller</label>
                                            </div>

                                            <input type="text" placeholder="Pilihan Variasi (pisahkan koma, cth: 🐰 Bunny, 🐻 Bear)" value={newProduct.optionsStr} onChange={e => setNewProduct({...newProduct, optionsStr: e.target.value})} className="w-full border border-pink-100 bg-white rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-pink-400 outline-none" />
                                            <input type="text" placeholder="Deskripsi singkat..." value={newProduct.description} onChange={e => setNewProduct({...newProduct, description: e.target.value})} className="w-full border border-pink-100 bg-white rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-pink-400 outline-none" />
                                            
                                            <button type="submit" className="w-full bg-pink-500 text-white font-bold py-2.5 rounded-xl text-xs hover:bg-pink-600 shadow-md">Simpan Produk</button>
                                        </form>

                                        <div className="bg-pink-50/40 p-3 rounded-2xl border border-pink-100 space-y-2">
                                            <label className="text-[11px] font-bold text-pink-700 block">📦 Kelola Stok & Produk:</label>
                                            <div className="max-h-40 overflow-y-auto space-y-1.5 pr-1">
                                                {products.map(p => (
                                                    <div key={p.id} className="flex items-center justify-between bg-white p-2 rounded-xl border border-pink-100 text-xs">
                                                        <span className="font-semibold text-gray-700 truncate max-w-[140px]">{p.name}</span>
                                                        <div className="flex items-center gap-1.5">
                                                            <button onClick={() => toggleSoldOut(p.id)} className={`px-2 py-1 rounded-lg text-[10px] font-bold ${p.isSoldOut ? 'bg-red-500 text-white' : 'bg-emerald-500 text-white'}`}>
                                                                {p.isSoldOut ? 'Sold Out ❌' : 'Ready ✅'}
                                                            </button>
                                                            <button onClick={() => deleteProduct(p.id)} className="bg-gray-200 text-gray-600 px-2 py-1 rounded-lg text-[10px] font-bold hover:bg-red-100 hover:text-red-600">
                                                                Hapus
                                                            </button>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                )}

                                <div className="space-y-3">
                                    <div className="flex gap-2">
                                        <div className="relative flex-1">
                                            <span className="absolute left-3 top-2.5 text-gray-400 text-sm">🔍</span>
                                            <input type="text" placeholder="Cari stiker lucu..." value={searchQuery} onChange={e => setSearchQuery(e.target.value)} className="w-full pl-9 pr-4 py-2.5 bg-white border border-pink-100 rounded-2xl text-xs focus:ring-2 focus:ring-pink-400 outline-none shadow-sm" />
                                        </div>
                                        <select value={sortBy} onChange={e => setSortBy(e.target.value)} className="bg-white border border-pink-100 rounded-2xl px-3 py-2.5 text-xs font-bold text-pink-600 outline-none shadow-sm cursor-pointer">
                                            <option value="default">✨ Urutan Normal</option>
                                            <option value="cheapest">🏷️ Termurah dulu</option>
                                            <option value="expensive">💎 Termahal dulu</option>
                                        </select>
                                    </div>

                                    <div className="flex gap-2 overflow-x-auto hide-scrollbar pb-1">
                                        {CATEGORIES.map(cat => (
                                            <button key={cat} onClick={() => setSelectedCategory(cat)} className={`px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition shadow-sm ${selectedCategory === cat ? 'bg-pink-500 text-white shadow-pink-200' : 'bg-white text-gray-600 border border-pink-100 hover:bg-pink-50'}`}>
                                                {cat === 'Semua' ? '✨ ' : cat === 'New Upload' ? '🔥 ' : '🎀 '} {cat}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    {filteredProducts.map(p => {
                                        const currentSelectedOpt = selectedOptions[p.id] || (p.options && p.options[0]);
                                        return (
                                            <div key={p.id} className={`bg-white border rounded-3xl p-4 flex flex-col justify-between shadow-sm transition ${p.isSoldOut ? 'border-gray-200 opacity-80' : 'border-pink-100 hover:shadow-md'}`}>
                                                <div>
                                                    <div className="bg-pink-50/50 rounded-2xl h-36 flex items-center justify-center relative mb-3 border border-pink-50 overflow-hidden">
                                                        {p.image ? (
                                                            <img src={p.image} alt={p.name} className={`w-full h-full object-cover ${p.isSoldOut ? 'grayscale' : ''}`} />
                                                        ) : (
                                                            <span className="text-4xl">🌸</span>
                                                        )}
                                                        <span className="absolute top-2 left-2 bg-white/80 backdrop-blur-sm text-[9px] font-bold px-2 py-0.5 rounded-full text-pink-600 border border-pink-100 shadow-sm">
                                                            {p.category}
                                                        </span>
                                                        {p.isBestSeller && !p.isSoldOut && (
                                                            <span className="absolute top-2 right-2 bg-amber-400 text-white text-[9px] font-bold px-2.5 py-0.5 rounded-full shadow-md flex items-center gap-1">
                                                                <span>🔥</span> Best Seller
                                                            </span>
                                                        )}
                                                        {p.isSoldOut && (
                                                            <div className="absolute inset-0 bg-black/40 backdrop-blur-[1px] flex items-center justify-center">
                                                                <span className="bg-red-500 text-white font-bold text-xs px-3 py-1 rounded-full shadow-lg tracking-wider">SOLD OUT ❌</span>
                                                            </div>
                                                        )}
                                                    </div>
                                                    <h3 className="font-bold text-xs text-gray-800 mt-0.5">{p.name}</h3>
                                                    <p className="text-[10px] text-gray-400 line-clamp-1 mt-0.5">{p.description}</p>
                                                    
                                                    {p.options && p.options.length > 0 && !p.isSoldOut && (
                                                        <div className="mt-2.5">
                                                            <p className="text-[10px] font-bold text-pink-600 mb-1">Pilih Variasi:</p>
                                                            <div className="flex flex-wrap gap-1.5">
                                                                {p.options.map(opt => (
                                                                    <button
                                                                        key={opt}
                                                                        type="button"
                                                                        onClick={() => handleOptionSelect(p.id, opt)}
                                                                        className={`px-3 py-1.5 rounded-xl text-[10px] font-bold transition border ${currentSelectedOpt === opt ? 'bg-pink-500 text-white border-pink-500 shadow-sm' : 'bg-pink-50/40 text-gray-600 border-pink-100 hover:bg-pink-100'}`}
                                                                    >
                                                                        {opt}
                                                                    </button>
                                                                ))}
                                                            </div>
                                                        </div>
                                                    )}
                                                </div>

                                                <div className="flex items-center justify-between mt-4 pt-3 border-t border-pink-50">
                                                    <span className="font-bold text-xs text-pink-600">{formatRp(p.price)}</span>
                                                    {p.isSoldOut ? (
                                                        <span className="bg-gray-100 text-gray-400 px-3 py-1.5 rounded-full font-bold text-xs">Habis ❌</span>
                                                    ) : (
                                                        <button onClick={() => addToCart(p)} className="bg-pink-100 text-pink-600 px-3 py-1.5 rounded-full hover:bg-pink-500 hover:text-white transition font-bold text-xs shadow-sm flex items-center gap-1">
                                                            <span>+ Keranjang</span>
                                                        </button>
                                                    )}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}
                    </main>

                    {/* CART DRAWER */}
                    {isCartOpen && (
                        <div className="fixed inset-0 z-50 bg-black/40 backdrop-blur-sm flex justify-end">
                            <div className="bg-white w-full max-w-md h-full flex flex-col shadow-2xl">
                                <div className="p-4 border-b border-pink-100 flex items-center justify-between bg-pink-50/30">
                                    <div className="flex items-center gap-2">
                                        <span className="text-xl">🛒</span>
                                        <h2 className="font-bold text-sm text-gray-800">Keranjang PO Kamu</h2>
                                    </div>
                                    <button onClick={() => setIsCartOpen(false)} className="w-8 h-8 rounded-full bg-white text-gray-500 flex items-center justify-center border border-pink-100 font-bold hover:bg-gray-100">✕</button>
                                </div>

                                <div className="flex-1 overflow-y-auto p-4 space-y-4">
                                    {cart.length === 0 ? (
                                        <div className="text-center py-16">
                                            <span className="text-4xl">🛒</span>
                                            <p className="text-gray-400 text-xs mt-3 font-medium">Keranjang masih kosong, yuk pilih stiker dulu! ✨</p>
                                        </div>
                                    ) : (
                                        <>
                                            <div className="space-y-2">
                                                {cart.map(item => (
                                                    <div key={item.cartItemId} className="flex items-center justify-between bg-pink-50/30 border border-pink-100 p-3 rounded-2xl">
                                                        <div className="flex-1 pr-2">
                                                            <h4 className="font-bold text-xs text-gray-800">{item.name}</h4>
                                                            <p className="text-[10px] text-pink-500 font-medium">Varian: {item.selectedOption}</p>
                                                            <p className="text-[10px] text-pink-600 font-semibold mt-0.5">{formatRp(item.price)}</p>
                                                        </div>
                                                        <div className="flex items-center gap-2 bg-white border border-pink-100 px-2 py-1 rounded-xl">
                                                            <button onClick={() => updateQty(item.cartItemId, -1)} className="text-gray-400 hover:text-gray-600 font-bold text-xs px-1">-</button>
                                                            <span className="text-xs font-bold text-gray-800 w-4 text-center">{item.quantity}</span>
                                                            <button onClick={() => updateQty(item.cartItemId, 1)} className="text-pink-600 hover:text-pink-800 font-bold text-xs px-1">+</button>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>

                                            <div className="bg-pink-50/50 border border-pink-100 p-3 rounded-2xl space-y-2">
                                                <label className="text-[11px] font-bold text-gray-700 block">Pilih Jalur Pengiriman:</label>
                                                <div className="grid grid-cols-2 gap-2">
                                                    <button type="button" onClick={() => setCustomerInfo({...customerInfo, shippingMethod: 'sea'})} className={`py-2 rounded-xl text-[11px] font-bold border transition ${customerInfo.shippingMethod === 'sea' ? 'bg-pink-500 text-white border-pink-500 shadow-sm' : 'bg-white text-gray-600 border-pink-100'}`}>
                                                        Laut 🚢 (± 4-5 mg)
                                                    </button>
                                                    <button type="button" onClick={() => setCustomerInfo({...customerInfo, shippingMethod: 'air'})} className={`py-2 rounded-xl text-[11px] font-bold border transition ${customerInfo.shippingMethod === 'air' ? 'bg-pink-500 text-white border-pink-500 shadow-sm' : 'bg-white text-gray-600 border-pink-100'}`}>
                                                        Udara ✈️ (± 7-12 hr)
                                                    </button>
                                                </div>
                                            </div>

                                            <div className="space-y-2">
                                                <label className="text-[11px] font-bold text-gray-700 block">Data Pemesan:</label>
                                                <input type="text" placeholder="Nama Pemesan*" value={customerInfo.name} onChange={e => setCustomerInfo({...customerInfo, name: e.target.value})} className="w-full border border-pink-100 bg-pink-50/30 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-pink-400 outline-none" required />
                                                <input type="text" placeholder="No WhatsApp (Aktif)*" value={customerInfo.phone} onChange={e => setCustomerInfo({...customerInfo, phone: e.target.value})} className="w-full border border-pink-100 bg-pink-50/30 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-pink-400 outline-none" required />
                                            </div>

                                            <div className="bg-amber-50/60 border border-amber-200 p-3 rounded-2xl text-[11px] text-amber-900 space-y-1 flex items-center justify-between">
                                                <div>
                                                    <p className="font-bold">Pembayaran Via BCA:</p>
                                                    <p className="font-mono font-bold text-xs">8830-1928-33 a/n Septi</p>
                                                </div>
                                                <button onClick={() => { navigator.clipboard.writeText("8830192833"); notify("📋 No Rekening berhasil disalin!"); }} className="bg-amber-200 text-amber-900 px-2.5 py-1 rounded-xl text-[10px] font-bold hover:bg-amber-300 transition">Copy Rek</button>
                                            </div>
                                        </>
                                    )}
                                </div>

                                {cart.length > 0 && (
                                    <div className="p-4 border-t border-pink-100 bg-pink-50/30 space-y-2">
                                        <div className="space-y-1 text-xs">
                                            <div className="flex justify-between text-gray-500">
                                                <span>Subtotal Produk</span>
                                                <span className="font-semibold text-gray-800">{formatRp(subtotal)}</span>
                                            </div>
                                            <div className="flex justify-between text-gray-500">
                                                <span>Est. Fee Jastip</span>
                                                <span className="font-semibold text-gray-800">{formatRp(jastipFee)}</span>
                                            </div>
                                            <div className="flex justify-between text-sm font-bold text-pink-600 pt-1 border-t border-pink-100">
                                                <span>Total Estimasi</span>
                                                <span>{formatRp(grandTotal)}</span>
                                            </div>
                                        </div>

                                        <div className="flex gap-2 pt-1">
                                            <button onClick={copyOrderTextOnly} className="bg-amber-500 text-white font-bold px-3 py-3 rounded-2xl text-xs hover:bg-amber-600 transition shadow-md shadow-amber-200 flex items-center justify-center gap-1" title="Salin format teks order">
                                                <span>📋 Salin</span>
                                            </button>
                                            <button onClick={generateWAMessage} className="flex-1 bg-pink-500 text-white font-bold py-3 rounded-2xl text-xs hover:bg-pink-600 transition shadow-md shadow-pink-200 flex items-center justify-center gap-2">
                                                <span>💬</span> Kirim Pesanan via WhatsApp
                                            </button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
